name: Publish JustFit
# The 2.6 wheel is built, signed and tested on Apple silicon outside CI. This
# workflow publishes those exact bytes: it checks the repository source against
# the wheel's pinned manifest, takes the wheel attached to the GitHub Release,
# verifies its SHA-256 and uploads it with PyPI trusted publishing.
# Run it from the release tag (Actions > Publish JustFit > Use workflow from
# tag v2.6.0) after the GitHub Release with the wheel exists.
on:
  workflow_dispatch:
    inputs:
      index:
        description: Target package index (production requires the matching release tag)
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
permissions:
  contents: read
env:
  VERSION: 2.6.0
  WHEEL: justfit_llm-2.6.0-py3-none-macosx_26_0_arm64.whl
  WHEEL_SHA256: a3ef01420bb6ca44f98fa9409583357fa6a3761befd562780b9172331656584a
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check publication target
        env:
          TARGET_INDEX: ${{ inputs.index }}
        run: |
          if [ "$TARGET_INDEX" = pypi ]; then
            test "$GITHUB_REF" = "refs/tags/v$VERSION" || { echo "production requires tag v$VERSION"; exit 1; }
          fi
      - name: Fetch the release wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$WHEEL" --dir dist
          echo "$WHEEL_SHA256  dist/$WHEEL" | sha256sum -c -
      - name: Repository source matches the wheel
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, zipfile
          wheel = zipfile.ZipFile('dist/' + os.environ['WHEEL'])
          root = 'justfit_llm-2.6.0.data/data/share/justfit-llm/'
          shipped = json.loads(wheel.read(root + 'package-manifest.json'))
          assert shipped == json.load(open('package-manifest.json')), 'package-manifest.json differs from the wheel'
          checked = 0
          for name, digest in shipped.items():
              assert hashlib.sha256(wheel.read(root + name)).hexdigest() == digest, name
              if name in ('bin/justfit', 'README.md'):
                  continue
              assert hashlib.sha256(open(name, 'rb').read()).hexdigest() == digest, name
              checked += 1
          print(f'{checked} source files match the wheel')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel
          path: dist/*
          retention-days: 7
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: ${{ inputs.index }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wheel
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
