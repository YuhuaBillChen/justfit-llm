name: Publish JustFit Python package
on:
  push:
    tags: ['v*.*.*rc*']
  workflow_dispatch:
    inputs:
      index:
        description: Target package index (production requires a matching stable tag)
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check publication target
        env:
          TARGET_INDEX: ${{ inputs.index || 'testpypi' }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PYCODE'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:rc[0-9]+)?', version)
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              assert os.environ['RELEASE_REF'] == 'refs/tags/v' + version, 'tag must match package version'
          if os.environ['TARGET_INDEX'] == 'pypi':
              assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'production requires a stable version'
              assert os.environ['RELEASE_REF'] == 'refs/tags/v' + version, 'production requires the matching reviewed release tag'
          PYCODE
      - name: Install runtime and build tools
        run: python -m pip install -r requirements-runtime.txt build==1.6.1 twine==7.0.0 setuptools==84.2.1 wheel==0.48.0
      - name: Verify reviewed sources and build distributions
        env:
          SOURCE_DATE_EPOCH: '1792540800'
        run: |
          python validate_package.py
          python package_release.py --output "$RUNNER_TEMP/JustFit-source.zip"
          git diff --exit-code -- package-manifest.json
          python -m build --no-isolation
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/*
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.index || 'testpypi' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'push' || inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
