[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "justfit-llm"
version = "2.3.0rc24"
description = "Apple silicon inference with coordinated CPU, GPU and ANE work"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "source/THIRD_PARTY_NOTICES"]
dynamic = ["dependencies"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/YuhuaBillChen/justfit-llm"
Repository = "https://github.com/YuhuaBillChen/justfit-llm"
Issues = "https://github.com/YuhuaBillChen/justfit-llm/issues"

[project.scripts]
justfit = "justfit_llm.cli:main"
justfit-llm = "justfit_llm.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["justfit_llm"]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = "requirements-runtime.txt"}
